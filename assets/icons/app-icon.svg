<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">わたしの収集手帳</title>
  <desc id="desc">和紙の上に深緑の収集手帳を置いた印</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddcfaf"/>
      <stop offset="1" stop-color="#b9a47e"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#315b59"/>
      <stop offset="1" stop-color="#173837"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="soft-light"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="8" dy="13" stdDeviation="10" flood-color="#392d20" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="92" fill="url(#paper)"/>
  <g filter="url(#grain)" opacity=".23">
    <rect width="512" height="512" rx="92" fill="#7c6747"/>
  </g>
  <g transform="rotate(-3 256 256)" filter="url(#shadow)">
    <rect x="128" y="79" width="270" height="354" rx="8" fill="url(#book)" stroke="#102e2d" stroke-width="8"/>
    <path d="M158 87v338" stroke="#c7a461" stroke-width="9" opacity=".78"/>
    <rect x="183" y="116" width="163" height="280" rx="3" fill="#eee3c8" stroke="#b49a67" stroke-width="5"/>
    <rect x="195" y="128" width="139" height="256" fill="none" stroke="#9f8451" stroke-width="2" opacity=".62"/>
    <text x="265" y="187" text-anchor="middle" fill="#746342" font-family="Yu Mincho, serif" font-size="24" letter-spacing="6">旅帖</text>
    <text x="265" y="321" text-anchor="middle" fill="#2e2922" font-family="Yu Mincho, serif" font-size="112" font-weight="700">集</text>
    <circle cx="339" cy="368" r="30" fill="#96352b" opacity=".9"/>
    <text x="339" y="378" text-anchor="middle" fill="#f0dfc3" font-family="Yu Mincho, serif" font-size="27" font-weight="700">印</text>
  </g>
</svg>
